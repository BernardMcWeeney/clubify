name = "clubify"
main = "dist/_worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"

# Environment variables
[vars]
SITE_URL = "https://clubify.ie"
APP_NAME = "Clubify"



[[d1_databases]]
binding = "DB"
database_name = "clubify-db"
database_id = "2bac1f43-2fbc-40b6-a129-a02b1d2b61cc"

# R2 Storage for media
# Run: wrangler r2 bucket create clubify-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "clubify-media"

# KV for caching (OPTIONAL)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "YOUR_KV_NAMESPACE_ID_HERE"

# Queue for async publishing jobs
# Run: wrangler queues create clubify-publish-queue
# [[queues.producers]]
# binding = "PUBLISH_QUEUE"
# queue = "clubify-publish-queue"

# [[queues.consumers]]
# queue = "clubify-publish-queue"
# max_batch_size = 10
# max_batch_timeout = 30
