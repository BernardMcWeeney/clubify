name = "clubify"
main = "dist/_worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"

# Environment variables
[vars]
SITE_URL = "https://clubify.ie"
APP_NAME = "Clubify"

# ===========================================
# CLOUDFLARE RESOURCES - CREATE THESE FIRST:
# ===========================================
#
# 1. Create D1 database:
#    wrangler d1 create clubify-db
#
# 2. Create R2 bucket (optional, for media):
#    wrangler r2 bucket create clubify-media
#
# 3. Create KV namespace (optional, for caching):
#    wrangler kv:namespace create CACHE
#
# Then uncomment and update the IDs below:
# ===========================================

[[d1_databases]]
binding = "clubify_db"
database_name = "clubify-db"
database_id = "2bac1f43-2fbc-40b6-a129-a02b1d2b61cc"

# R2 Storage for media
# Run: wrangler r2 bucket create clubify-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "clubify-media"

# KV for caching (OPTIONAL)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "YOUR_KV_NAMESPACE_ID_HERE"
